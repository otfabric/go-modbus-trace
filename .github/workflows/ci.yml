name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # Organisation checks: format, lint, vet, vulnerabilities, race tests, coverage.
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2
    with:
      codecov-name: go-modbus-trace
      go-versions: '["1.23", "1.24", "1.25", "1.26", "1.27"]'
    secrets: inherit

  # The CLI is a nested module (ADR-0009).
  cli:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v2.1.0
    with:
      module-dir: cmd/mbtracectl
      coverage-min: "85"
      test-exclude-regex: "/example(s)?($|/)"
      run-codecov: false
      go-versions: '["1.23", "1.24", "1.25", "1.26", "1.27"]'
    secrets: inherit

  # Every target of REQUIREMENTS.md "Programs" builds and tests with
  # CGO_ENABLED=0 on a runner of its own architecture. Nothing is emulated (no
  # QEMU): linux/arm (v7) has no hosted runner, so it is cross-compiled on the
  # arm64 runner and not executed (user decision, docs/DECISIONS.md Q2). Every
  # Linux job checks with `file` that mbtracectl is statically linked.
  targets:
    name: Target ${{ matrix.os }}/${{ matrix.arch }}${{ matrix.goarm && 'v7' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04, test: true }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm, test: true }
          - { os: linux, arch: arm, goarm: "7", runner: ubuntu-24.04-arm, test: false }
          - { os: darwin, arch: arm64, runner: macos-latest, test: true }
          - { os: darwin, arch: amd64, runner: macos-15-intel, test: true }
          - { os: windows, arch: amd64, runner: windows-latest, test: true }
          - { os: windows, arch: arm64, runner: windows-11-arm, test: true }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      GOARM: ${{ matrix.goarm }}
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: No replace directives
        run: make mod-check
      - name: Build
        run: |
          go build ./...
          (cd cmd/mbtracectl && go build -o "$RUNNER_TEMP/" ./...)
      - name: Test
        if: matrix.test
        run: |
          go test -count=1 ./...
          (cd cmd/mbtracectl && go test -count=1 ./...)
      - name: Static binary
        if: matrix.os == 'linux'
        run: |
          (cd cmd/mbtracectl && go build -trimpath -o ../../mbtracectl .)
          file mbtracectl
          file mbtracectl | grep -q 'statically linked'

  # LA10: trace -> export mbcap -> the pinned mbcapctl verify and modbusctl
  # replay -> a go-modbus client reads the scripted values. Required here.
  replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Pinned tools
        run: make tools
      - name: Replay end to end
        run: make replay

  # LA13: Wireshark's dissector as an oracle. Advisory: a disagreement is
  # triaged by hand (TESTING.md section 4) and never fails the run.
  oracle:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Install tshark
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark
          tshark --version | head -n1
      - name: Compare with tshark
        run: MBTRACE_ORACLE=1 go test -count=1 -run 'TestTsharkOracle|TestExtract' -v ./trace ./export/subtrace

  # LA18: Scan and Analyze throughput on pull requests, the base against the
  # head on the same runner. Reported, not gating: a slowdown above 20% is a
  # warning annotation.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Benchmark head
        run: go test -run '^$' -bench 'Scan|Analyze' -benchtime 20x -count 5 ./trace | tee head.txt
      - name: Benchmark base
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          if [ -f ../base/trace/bench_test.go ]; then
            (cd ../base && go test -run '^$' -bench 'Scan|Analyze' -benchtime 20x -count 5 ./trace) | tee base.txt
          else
            echo "the base has no benchmarks" | tee base.txt
          fi
      - name: Compare
        run: |
          # median ns/op per benchmark (plain POSIX tools: the runner's awk is mawk)
          med() { grep '^Benchmark' "$1" | awk '{ print $1, $3 }' | sort -k1,1 -k2,2n |
            awk '{ v[$1, ++n[$1]] = $2 } END { for (b in n) print b, v[b, int((n[b] + 1) / 2)] }' | sort; }
          med base.txt > base.med
          med head.txt > head.med
          echo "| Benchmark | base ns/op | head ns/op | change |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          join -a 2 base.med head.med | while read -r b x y; do
            if [ -z "$y" ]; then y=$x; x=""; fi
            if [ -n "$x" ]; then
              d=$(awk -v a="$x" -v b="$y" 'BEGIN { printf "%+.1f%%", (b - a) * 100 / a }')
              slow=$(awk -v a="$x" -v b="$y" 'BEGIN { print (b > a * 1.2) ? 1 : 0 }')
              [ "$slow" = 1 ] && echo "::warning::$b is ${d} slower than the base"
            else
              d="new"
            fi
            echo "| $b | ${x:--} | $y | $d |" >> "$GITHUB_STEP_SUMMARY"
          done

  # LA14: 2 GiB of generated trace streamed through Scan and Analyze; the
  # live heap must stay flat (make soak; 5 GiB by hand).
  soak:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make soak SOAK_GIB=2

  # A time-boxed run of every fuzz target on pull requests (TESTING.md
  # section 3); the seed corpora run in every test job.
  fuzz:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make fuzz FUZZ_TIME=30s
