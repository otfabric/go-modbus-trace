# Documents against the code (DOC-008, standards/documentation.md#doc-sync).
# pr.yml calls it on every pull request; on main it runs on every push, with
# no path filter.
name: Docs
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs (library)
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.8.0
    with:
      docsync-version: v0.3.1
      # No policy.yml in this repository: this job runs otfabric-policy, so
      # Markdown-only changes still get the Policy check.
      policy-version: v1.6.1
    secrets: inherit

  docs-cli:
    name: Docs (cmd/mbtracectl)
    uses: otfabric/.github/.github/workflows/docs-check.yml@v3.8.0
    with:
      module-dir: cmd/mbtracectl
      docsync-version: v0.3.1
      policy-version: v1.6.1
    secrets: inherit
